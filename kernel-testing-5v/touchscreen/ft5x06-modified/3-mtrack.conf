Section "InputClass"
	Identifier "Focaltech Touchscreen"
	MatchProduct "FocalTech FT5x06 Production Touchscreen"
	MatchDevicePath "/dev/input/event*"

	Driver "mtrack"

	# Repo git israelins85
	#Option "AbsoluteTrack" "true"

	# Repo git kurt-vd
	Option "Absolute" "on"
	Option "SingleFinger" "on"
	Option "BottomEdge" "0"
	Option "ScrollDistance" "50"
	Option "ScrollUpButtom" "5"
	Option "ScrollDownButtom" "4"
	

EndSection


